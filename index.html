    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        function searchVideos() {

            let input = document.getElementById("searchBox").value.toLowerCase().trim();

            let sections = document.querySelectorAll(".content-section");

            sections.forEach(function (section) {

                let boxes = section.querySelectorAll(".video-box");
                let hasMatch = false;

                boxes.forEach(function (box) {

                    let dataTitle = (box.getAttribute("data-title") || "").toLowerCase();

                    let caption = "";
                    let figcaption = box.querySelector("figcaption");
                    if (figcaption) {
                        caption = figcaption.textContent.toLowerCase();
                    }

                    let iframeTitle = "";
                    let iframe = box.querySelector("iframe");
                    if (iframe) {
                        iframeTitle = (iframe.getAttribute("title") || "").toLowerCase();
                    }

                    let searchText = dataTitle + " " + caption + " " + iframeTitle;

                    if (searchText.includes(input)) {
                        box.style.display = "";
                        hasMatch = true;
                    } else {
                        box.style.display = "none";
                    }

                });

                if (input === "") {
                    section.style.display = "";
                    boxes.forEach(function (box) {
                        box.style.display = "";
                    });
                } else {
                    section.style.display = hasMatch ? "" : "none";
                }

            });

        }

        // YouTube Players

        let players = [];


        function onYouTubeIframeAPIReady() {

            console.log("YouTube API Ready");


            for (let i = 1; i <= 8; i++) {


                players[i - 1] = new YT.Player("player" + i, {

                    events: {

                        "onStateChange": onPlayerStateChange

                    }

                });


            }

        }



        // When YouTube video plays

        function onPlayerStateChange(event) {


            if (event.data == YT.PlayerState.PLAYING) {


                players.forEach(function (player) {


                    if (player && player !== event.target) {

                        player.pauseVideo();

                    }


                });


                // Pause local videos and audio

                let media = document.querySelectorAll("video,audio");


                media.forEach(function (item) {

                    item.pause();

                });



            }


        }



        // When Local video/audio plays

        const mediaFiles = document.querySelectorAll("video,audio");


        mediaFiles.forEach(function (media) {


            media.addEventListener("play", function () {


                // Pause other local media

                mediaFiles.forEach(function (other) {


                    if (other !== media) {

                        other.pause();

                    }


                });



                // Pause YouTube videos

                players.forEach(function (player) {


                    if (player && player.pauseVideo) {

                        player.pauseVideo();

                    }


                });



            });


        });


    </script>
